<select
  class="version-select"
  [disabled]="!groups.length"
  (change)="onChange($event)">
  @if (!groups.length) {
    <option value="">—</option>
  }
  @for (gen of groups; track gen.generationName) {
    <optgroup [label]="gen.generationName">
      @for (opt of gen.options; track opt.id) {
        <option
          [value]="opt.id"
          [selected]="opt.id === selectedId">
          {{ opt.label }}
        </option>
      }
    </optgroup>
  }
</select>
