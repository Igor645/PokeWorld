<div class="tabs">
  @for (tab of tabs; track tab.id) {
    <button
      class="tab"
      [class.active]="activeTab === tab.id"
      (click)="tabChange.emit(tab.id)">
      @if (tab.icon) {
        <mat-icon>{{ tab.icon }}</mat-icon>
      }
      {{ tab.label }}
    </button>
  }
</div>

<ng-content />
