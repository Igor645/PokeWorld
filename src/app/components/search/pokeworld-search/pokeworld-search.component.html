<div class="search-field-wrap">
  <mat-form-field class="search-container">
    <input #searchInput matInput type="text" placeholder="Search through PokeWorld..." [formControl]="searchControl"
      [matAutocomplete]="auto" (keydown)="onKeydown($event)" (focus)="onFocus()" />

    <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption (optionSelected)="onOptionSelected($event)">
      @if (isLoading && !filteredPokemonSpecies.length) {
      <mat-option disabled class="search-loading-option">
        Searching…
      </mat-option>
      }
      @if (filteredPokemonSpecies.length) {
      <mat-optgroup label="Pokémon">
        @for (species of filteredPokemonSpecies; track trackByPokemon($index, species)) {
        <mat-option [value]="species">
          <app-pokemon-search-item [species]="species" endpoint="pokemon"
            [imageSrc]="getPokemonOfficialImage(species.pokemons[0])">g </app-pokemon-search-item>
        </mat-option>
        }
      </mat-optgroup>
      }
    </mat-autocomplete>
  </mat-form-field>

  <!-- Spinner overlaid on the right side of the input — avoids Angular Material suffix slot issues -->
  @if (isLoading) {
  <span class="search-spinner" role="status" aria-label="Loading"></span>
  }
</div>
